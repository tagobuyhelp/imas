    <!-- NPF Chatbot Loader Script -->
    <script type="text/javascript" async src="https://chatbot.in8.nopaperforms.com/en-gb/backend/bots/niaachtbtscpt.js/f66854412785432ea1d2c2257fe7861f/71289f36cb7f4d1aa57ea9599d67b976"></script>
    <script>
      (function() {
        try {
          console.log('[NPF Chatbot] initializing: looking for placeholder and loader');
          var placeholder = document.querySelector('.npf_chatbots');
          if (!placeholder) {
            console.warn('[NPF Chatbot] placeholder not found');
          } else {
            console.log('[NPF Chatbot] placeholder present');
          }

          var loader = Array.from(document.scripts).find(function(s){
            return s.src && s.src.indexOf('niaachtbtscpt.js') !== -1;
          });
          if (loader) {
            loader.addEventListener('load', function(){
              console.log('[NPF Chatbot] loader script loaded');
            });
            loader.addEventListener('error', function(e){
              console.error('[NPF Chatbot] loader script failed to load', e);
            });
          } else {
            console.warn('[NPF Chatbot] loader script tag not found');
          }

          if (placeholder) {
            var obs = new MutationObserver(function(){
              if (placeholder.childElementCount > 0) {
                console.log('[NPF Chatbot] widget mounted');
              }
            });
            obs.observe(placeholder, { childList: true, subtree: true });
            if (placeholder.childElementCount > 0) {
              console.log('[NPF Chatbot] widget already mounted');
            }
          }

          setTimeout(function(){
            if (placeholder && placeholder.childElementCount === 0) {
              console.log('[NPF Chatbot] still waiting after 5s – check token/CSP/ad-blockers');
            }
          }, 5000);
        } catch (e) {
          console.error('[NPF Chatbot] instrumentation error', e);
        }
      })();
    </script>
    
    <!-- NPF Popup Helpers: open popup programmatically and auto-download brochure after submit -->
    <script>
      // Initialize provided widget IDs if not already initialized elsewhere
      try {
        if (typeof NpfWidgetsInit === 'function') {
          // Create hidden triggers for both widgets so we can open them via JS
          (function ensureHiddenTriggers(){
            var ids = ['550974b33503dfc785c6fbf5148e6d84','b90761d553ba1ef721aa08c760f669b3'];
            ids.forEach(function(id){
              var cls = 'npfWidget-' + id;
              if (!document.querySelector('.' + cls)) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'npfWidgetButton ' + cls;
                btn.style.display = 'none';
                btn.textContent = 'Enquire';
                document.body.appendChild(btn);
              }
            });
          })();

          // Expose a helper to open a specific widget popup
          window.openNpfPopup = function(widgetId) {
            var trigger = document.querySelector('.npfWidget-' + widgetId);
            if (trigger) {
              trigger.click();
            } else {
              console.warn('[NPF] Popup trigger not found for widget', widgetId);
            }
          };
        }
      } catch (e) {
        console.warn('[NPF] popup helpers init failed', e);
      }

      // Auto-download brochure on NPF success; configure widget to call this.
      window.npfFormSuccess = function() {
        try {
          var href = window.__imasPendingBrochureHref || '/uploads/IMAS_PGDM_Plus_2025_Brochure.pdf';
          var a = document.createElement('a');
          a.href = href;
          a.download = '';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.__imasPendingBrochureHref = null;
          console.log('[NPF] Brochure download triggered:', href);
        } catch (e) {
          console.error('[NPF] Brochure auto-download failed', e);
        }
      };

      // Best-effort: listen for postMessage from NPF and trigger auto-download
      window.addEventListener('message', function(ev){
        try {
          var originOk = ev.origin && (ev.origin.indexOf('nopaperforms.com') !== -1 || ev.origin.indexOf('npfs.co') !== -1);
          if (!originOk) return;
          var payload = ev.data;
          var str = typeof payload === 'string' ? payload : JSON.stringify(payload || {});
          if (str && /(npf|lead|submit|success)/i.test(str)) {
            window.npfFormSuccess();
          }
        } catch (e) {
          // swallow
        }
      });
    </script>
