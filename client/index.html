    <script>
      (function() {
        try {
          console.log('[NPF Chatbot] initializing: looking for placeholder and loader');
          var placeholder = document.querySelector('.npf_chatbots');
          if (!placeholder) {
            console.warn('[NPF Chatbot] placeholder not found');
          } else {
            console.log('[NPF Chatbot] placeholder present');
          }

          var loader = Array.from(document.scripts).find(function(s){
            return s.src && s.src.indexOf('niaachtbtscpt.js') !== -1;
          });
          if (loader) {
            loader.addEventListener('load', function(){
              console.log('[NPF Chatbot] loader script loaded');
            });
            loader.addEventListener('error', function(e){
              console.error('[NPF Chatbot] loader script failed to load', e);
            });
          } else {
            console.warn('[NPF Chatbot] loader script tag not found');
          }

          if (placeholder) {
            var obs = new MutationObserver(function(){
              if (placeholder.childElementCount > 0) {
                console.log('[NPF Chatbot] widget mounted');
              }
            });
            obs.observe(placeholder, { childList: true, subtree: true });
            if (placeholder.childElementCount > 0) {
              console.log('[NPF Chatbot] widget already mounted');
            }
          }

          setTimeout(function(){
            if (placeholder && placeholder.childElementCount === 0) {
              console.log('[NPF Chatbot] still waiting after 5s – check token/CSP/ad-blockers');
            }
          }, 5000);
        } catch (e) {
          console.error('[NPF Chatbot] instrumentation error', e);
        }
      })();
    </script>
